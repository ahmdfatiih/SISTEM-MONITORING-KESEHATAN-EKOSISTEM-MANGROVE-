<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>WebGIS Monitoring Mangrove 2021</title>

    <!-- =====================================================
         LEAFLET CSS
         ===================================================== -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        /* Judul */
        .judul {
            position: absolute;
            top: 15px;
            left: 60px;
            z-index: 1000;

            background: white;
            padding: 12px 18px;

            border-radius: 8px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.3);

            font-size: 18px;
            font-weight: bold;
        }

        /* Status */
        .status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;

            background: white;
            padding: 10px 15px;

            border-radius: 6px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.3);

            font-size: 14px;
        }

        /* Legenda */
        .legend {
            background: white;
            padding: 12px;

            line-height: 22px;

            border-radius: 6px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.3);
        }

        .legend-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .legend-item {
            display: flex;
            align-items: center;
        }

        .legend-color {
            width: 25px;
            height: 16px;
            margin-right: 8px;
            border: 1px solid #555;
        }

    </style>

</head>


<body>


<!-- =====================================================
     JUDUL
     ===================================================== -->

<div class="judul">
    Monitoring Kesehatan Ekosistem Mangrove - Tahun 2021
</div>


<!-- =====================================================
     PETA
     ===================================================== -->

<div id="map"></div>


<!-- =====================================================
     STATUS
     ===================================================== -->

<div class="status" id="status">
    Memuat raster mangrove 2021...
</div>


<!-- =====================================================
     LEAFLET JS
     ===================================================== -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<!-- =====================================================
     GEORASTER
     ===================================================== -->

<script src="https://unpkg.com/georaster"></script>


<!-- =====================================================
     GEORASTER LAYER FOR LEAFLET
     ===================================================== -->

<script src="https://unpkg.com/georaster-layer-for-leaflet"></script>


<script>

/* ========================================================
   1. MEMBUAT PETA
   ======================================================== */

const map = L.map("map").setView(
    [-5.48, 105.25],
    10
);


/* ========================================================
   2. BASEMAP ESRI SATELLITE
   ======================================================== */

const satellite = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/" +
    "World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
        attribution:
            "Tiles © Esri"
    }
);

satellite.addTo(map);


/* ========================================================
   3. URL RASTER
   ======================================================== */

/*
   Repository:

   https://ahmdfatih.github.io/
   SISTEM-MONITORING-KESEHATAN-EKOSISTEM-MANGROVE/

   File:

   DATA/mangrove_2021.tif
*/

const rasterURL =
    "https://ahmdfatih.github.io/" +
    "SISTEM-MONITORING-KESEHATAN-EKOSISTEM-MANGROVE/" +
    "DATA/mangrove_2021.tif";


/* ========================================================
   4. WARNA KELAS MANGROVE
   ======================================================== */

const warnaKelas = {

    // Kelas 1
    1: "#8B0000",

    // Kelas 2
    2: "#A66A2C",

    // Kelas 3
    3: "#8F8F5A",

    // Kelas 4
    4: "#4F8F2F",

    // Kelas 5
    5: "#006B35"
};


/* ========================================================
   5. NAMA KELAS
   ======================================================== */

const namaKelas = {

    1: "Sangat Tidak Sehat",

    2: "Tidak Sehat",

    3: "Sedang",

    4: "Sehat",

    5: "Sangat Sehat"
};


/* ========================================================
   6. MEMUAT RASTER
   ======================================================== */

async function loadRaster() {

    const status =
        document.getElementById("status");


    try {

        status.innerHTML =
            "Mengunduh raster mangrove 2021...";


        console.log(
            "Memuat:",
            rasterURL
        );


        /* =================================================
           DOWNLOAD FILE TIFF
           ================================================= */

        const response =
            await fetch(rasterURL);


        if (!response.ok) {

            throw new Error(
                "File tidak ditemukan. HTTP " +
                response.status
            );

        }


        /* =================================================
           BACA DATA TIFF
           ================================================= */

        const arrayBuffer =
            await response.arrayBuffer();


        status.innerHTML =
            "Membaca raster mangrove 2021...";


        /* =================================================
           PARSE GEOTIFF
           ================================================= */

        const georaster =
            await parseGeoraster(
                arrayBuffer
            );


        console.log(
            "GeoRaster:",
            georaster
        );


        /* =================================================
           TAMPILKAN RASTER
           ================================================= */

        const rasterLayer =
            new GeoRasterLayer({

                georaster: georaster,

                opacity: 0.75,

                resolution: 256,


                /*
                 * MENGUBAH NILAI PIXEL
                 * MENJADI WARNA
                 */

                pixelValuesToColorFn:
                    function(pixelValues) {

                        const value =
                            pixelValues[0];


                        /*
                         * NoData
                         */

                        if (
                            value === null ||
                            value === undefined ||
                            isNaN(value)
                        ) {

                            return null;

                        }


                        /*
                         * Bulatkan nilai
                         */

                        const kelas =
                            Math.round(value);


                        /*
                         * Ambil warna
                         */

                        if (
                            warnaKelas[kelas]
                        ) {

                            return warnaKelas[
                                kelas
                            ];

                        }


                        /*
                         * Nilai selain 1-5
                         */

                        return null;

                    }

            });


        /* =================================================
           TAMBAHKAN KE PETA
           ================================================= */

        rasterLayer.addTo(map);


        /* =================================================
           ZOOM KE RASTER
           ================================================= */

        rasterLayer.once(
            "load",
            function() {

                if (
                    rasterLayer.getBounds()
                ) {

                    map.fitBounds(
                        rasterLayer.getBounds()
                    );

                }

            }
        );


        /*
         * Alternatif zoom jika event
         * load tidak tersedia
         */

        setTimeout(
            function() {

                if (
                    rasterLayer.getBounds()
                ) {

                    map.fitBounds(
                        rasterLayer.getBounds()
                    );

                }

            },
            1500
        );


        /* =================================================
           STATUS BERHASIL
           ================================================= */

        status.innerHTML =
            "✓ Raster mangrove tahun 2021 berhasil dimuat";


        console.log(
            "Raster 2021 berhasil ditampilkan."
        );


    }


    catch (error) {


        /* =================================================
           JIKA ERROR
           ================================================= */

        console.error(
            "ERROR RASTER:",
            error
        );


        status.innerHTML =
            "✗ Raster 2021 gagal dimuat";


        alert(
            "Raster tahun 2021 gagal dimuat.\n\n" +

            "File yang dicari:\n" +

            rasterURL +

            "\n\n" +

            "Pastikan file tersebut ada di folder DATA " +
            "GitHub dan namanya persis:\n\n" +

            "mangrove_2021.tif"
        );

    }

}


/* ========================================================
   7. LEGENDA
   ======================================================== */

const legend =
    L.control({
        position: "bottomright"
    });


legend.onAdd =
    function() {

        const div =
            L.DomUtil.create(
                "div",
                "legend"
            );


        div.innerHTML =
            "<div class='legend-title'>" +
            "Kesehatan Mangrove 2021" +
            "</div>";


        for (
            let kelas = 1;
            kelas <= 5;
            kelas++
        ) {

            div.innerHTML +=

                "<div class='legend-item'>" +

                "<div class='legend-color' " +

                "style='background:" +
                warnaKelas[kelas] +
                "'></div>" +

                namaKelas[kelas] +

                "</div>";

        }


        return div;

    };


legend.addTo(map);


/* ========================================================
   8. JALANKAN RASTER
   ======================================================== */

loadRaster();

</script>

</body>
</html>
